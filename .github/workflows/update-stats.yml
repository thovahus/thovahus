name: Update GitHub Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity-graph:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      GITHUB_USERNAME: thovahus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate dark graph
        run: |
          export GRAPH_THEME=react-dark
          node generate-activity-graph.js
          mv graph.svg graph-dark.svg

      - name: Generate light graph
        run: |
          export GRAPH_THEME=react-light
          node generate-activity-graph.js
          mv graph.svg graph-light.svg

      - name: Commit and push graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graph-*.svg
          git commit -m "Update GitHub activity graphs" || echo "No changes"
          git push